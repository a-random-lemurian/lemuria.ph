baseURL: https://lemuria.ph
disablePathToLower: true
languageCode: en-us
title: Lemuria
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingID: true
    extensions:
      typographer: false

summaryLength: 1
permalinks:
  page:
    blog: /blog/:year/:slug
  archives: /blog/:slug

mediaTypes:
  application/atom+xml:
    suffixes:
    - xml

outputFormats:
  atom:
    mediaType: application/atom+xml
    noUgly: true
    baseName: feed

outputs:
  home:
  - html
  section:
  - html
  - atom

taxonomies:
  archive: archives

params:
  gitRepoUrl: https://github.com/a-random-lemurian/lemuria.ph

security:
  enableInlineShortcodes: true
